spring.application.name=skim
spring.ai.google.genai.api-key=${GEMINI_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

skim.ratelimit.per-ip-burst-limit=5
skim.ratelimit.per-ip-daily-limit=30
skim.ratelimit.global-daily-limit=250
skim.ratelimit.max-concurrent-ai-calls=3
skim.ratelimit.cache-ttl-minutes=15